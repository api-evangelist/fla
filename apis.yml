  sports medicine, and bracing products, including supports, braces, splints, and
  soft-goods for the medical, clinical, and consumer health markets. Canaan Partners
  invested in FLA Holdings at the Series D stage; the company was surfaced through
  that portfolio and added to the API Evangelist network as a lead. FLA Orthopedics
